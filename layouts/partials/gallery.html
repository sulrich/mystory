<!-- Gallery -->
<section class="wrapper style1 align-center"{{ with .Params.id }} id="{{ . }}"{{ end }}>
	<div class="inner">
		{{ with .Title }}<h2>{{ . }}</h2>{{ end }}
		{{ .Content }}
	</div>

	<div class="gallery {{ .Params.style }}">
		{{ range .Params.pictures }}
			{{ partial "picture" . }}
		{{ end }}
	</div>
</section>
